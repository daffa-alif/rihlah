name: Deploy RIHLAH Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: rihlah
          POSTGRES_PASSWORD: rihlah_test
          POSTGRES_DB: rihlah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://rihlah:rihlah_test@localhost:5432/rihlah_test
      - run: npm test -- --coverage
        env:
          DATABASE_URL: postgresql://rihlah:rihlah_test@localhost:5432/rihlah_test
          REDIS_URL: redis://localhost:6379
      - run: npm run lint

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Build and push
        run: |
          gcloud builds submit backend/ \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/rihlah-api \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/rihlah-api:${{ github.sha }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy rihlah-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/rihlah-api:${{ github.sha }} \
            --region asia-southeast2 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars=NODE_ENV=production
      - name: Run migrations
        run: |
          gcloud run jobs create rihlah-migrate \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/rihlah-api:${{ github.sha }} \
            --region asia-southeast2 \
            --command="npx" --args="prisma,migrate,deploy" \
            --set-env-vars=DATABASE_URL=${{ secrets.DATABASE_URL }}
