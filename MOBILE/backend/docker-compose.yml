version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: rihlah
      POSTGRES_PASSWORD: rihlah_dev
      POSTGRES_DB: rihlah
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rihlah']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://rihlah:rihlah_dev@postgres:5432/rihlah
      REDIS_URL: redis://redis:6379
      FIREBASE_PROJECT_ID: rihlah-75a1b
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
