[project]
name = "rihlah-backend"
version = "0.1.0"
description = "Backend API for the Rihlah trip planning platform."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
